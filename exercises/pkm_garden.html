<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Garden</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; min-height: 100%;
            font-family: 'Be Vietnam Pro', system-ui, sans-serif;
            background: linear-gradient(180deg, #bfe98a 0%, #9ed968 40%, #86c957 100%);
            color: #1c2b12;
            padding-bottom: 84px; /* chừa chỗ cho toolbar dính đáy */
        }

        /* ============ TOP BAR ============ */
        #top-bar {
            position: sticky; top: 0; z-index: 200;
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px; padding: 10px 12px;
            background: rgba(24, 40, 16, 0.92);
            border-bottom: 3px solid #ffcb05;
            color: #fff;
        }
        #top-bar .title { font-weight: 900; font-size: 15px; color: #a4e968; white-space: nowrap; }
        .back-link { color: #fff; text-decoration: none; font-size: 20px; }
        #lessonsLearnedTag {
            font-size: 10.5px; font-weight: 700; color: #cdeeb0;
            background: rgba(164,233,104,0.15); border: 1px solid rgba(164,233,104,0.45);
            padding: 3px 8px; border-radius: 14px; white-space: nowrap; flex-shrink: 0;
        }
        .currencies { display: flex; gap: 10px; font-weight: 900; font-size: 12.5px; flex-shrink: 0; }
        .currencies .dv { color: #ffcb05; }
        .currencies .exp { color: #6fd0ff; }
        #toolShopOpenBtn {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; border-radius: 12px; padding: 5px 9px; font-size: 15px;
            cursor: pointer; flex-shrink: 0;
        }

        /* ============ BANNER "ĐANG CẦM" ============ */
        #toolBanner {
            display: none; align-items: center; gap: 8px; justify-content: center;
            position: sticky; top: 49px; z-index: 190;
            background: linear-gradient(90deg, #ffcb05, #ff9f1c);
            color: #201400; font-weight: 800; font-size: 12.5px;
            padding: 7px 12px; text-align: center;
        }
        #toolBanner b { font-weight: 900; }
        #cancelToolBtn {
            background: rgba(0,0,0,0.15); border: none; color: #201400;
            width: 20px; height: 20px; border-radius: 50%; font-weight: 900;
            cursor: pointer; line-height: 1; margin-left: 6px;
        }

        /* ============ SECTIONS ============ */
        .garden-section { padding: 14px 12px 6px; }
        .garden-section h2 {
            font-size: 14.5px; font-weight: 900; margin: 2px 2px 10px;
            display: flex; align-items: center; gap: 6px; color: #1c3a12;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        /* ============ RUỘNG CÂY ============ */
        #landField {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
            background: rgba(120, 78, 42, 0.18);
            border: 3px dashed rgba(120, 78, 42, 0.45);
            border-radius: 16px;
            padding: 10px;
        }
        .land-plot {
            position: relative;
            min-height: 116px;
            background: linear-gradient(160deg, #a9714a 0%, #8a5a37 100%);
            border: 2px solid rgba(0,0,0,0.15);
            border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; text-align: center; padding: 6px 4px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform .12s ease;
        }
        .land-plot:active { transform: scale(0.96); }
        .land-plot.locked { cursor: default; background: linear-gradient(160deg, #6b6b6b, #4a4a4a); opacity: 0.7; }
        .plot-lock { font-size: 22px; }
        .plot-lock-text { font-size: 10px; font-weight: 700; color: #eee; }

        .land-plot.empty { background: linear-gradient(160deg, #c99a68, #a9714a); border-style: dashed; }
        .plot-plus { font-size: 26px; color: rgba(255,255,255,0.65); font-weight: 900; }

        .land-plot.growing { box-shadow: inset 0 3px 6px rgba(0,0,0,0.2), 0 0 0 2px rgba(111,208,255,0.5); }
        .land-plot.ready { box-shadow: inset 0 3px 6px rgba(0,0,0,0.2), 0 0 12px rgba(255,203,5,0.7); border-color: #ffcb05; }
        .land-plot.wilted { background: linear-gradient(160deg, #7a5240, #5a3a2c); }

        .plot-sprite {
            position: relative;
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; line-height: 1;
        }
        .plot-name { font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
        .plot-status { font-size: 9.5px; font-weight: 700; color: #ffe9a8; }
        .plot-care { font-size: 9px; color: #d8c3a8; }
        .plot-clear-btn {
            margin-top: 2px; font-family: inherit; font-weight: 800; font-size: 10px;
            background: #5c2323; color: #fff; border: none; border-radius: 8px; padding: 4px 8px; cursor: pointer;
        }

        /* ============ CHUỒNG TRẠI (KHU MỞ) ============ */
        #barnPen {
            position: relative;
            min-height: 240px;
            background:
                repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 10px, transparent 10px 20px),
                linear-gradient(160deg, #7fc750 0%, #63ad3d 100%);
            border: 6px solid transparent;
            border-image: repeating-linear-gradient(90deg, #a9714a 0 14px, #8a5a37 14px 28px) 6;
            border-radius: 18px;
            overflow: hidden;
        }
        .barn-empty-hint {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 20px; font-size: 12.5px; font-weight: 700; color: rgba(20,40,10,0.55);
        }
        .barn-sprite {
            position: absolute;
            width: 60px; height: 66px;
            display: flex; flex-direction: column; align-items: center;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }
        .barn-sprite img { width: 48px; height: 48px; image-rendering: pixelated; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.3)); }
        .barn-badge { font-size: 13px; margin-top: -6px; }
        .barn-name {
            font-size: 8.5px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            white-space: nowrap; background: rgba(0,0,0,0.25); border-radius: 6px; padding: 1px 4px; margin-top: 1px;
        }
        #addAnimalBtn {
            position: absolute; right: 10px; bottom: 10px; z-index: 5;
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #ffcb05, #ff9500); border: none;
            font-size: 20px; font-weight: 900; color: #1c1200; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* ============ THANH KHO ĐỒ (đáy màn hình) ============ */
        #toolbar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
            display: flex; gap: 8px; justify-content: center;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            background: rgba(18, 30, 12, 0.95);
            border-top: 3px solid #ffcb05;
        }
        .tool-btn {
            position: relative;
            background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 14px; width: 62px; height: 58px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; cursor: pointer; color: #fff;
        }
        .tool-btn.selected { border-color: #ffcb05; background: rgba(255,203,5,0.18); transform: translateY(-3px); }
        .tool-emoji { font-size: 22px; }
        .tool-count {
            font-size: 10px; font-weight: 900; color: #1c1200;
            background: #ffcb05; border-radius: 8px; padding: 0 6px; min-width: 16px;
        }

        /* ============ SHOP MODALS ============ */
        .shop-overlay {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(5,10,5,0.85); z-index: 6000; padding: 16px;
        }
        .shop-card {
            background: #14210f; border: 3px solid #6fcf3f; border-radius: 20px;
            width: 100%; max-width: 420px; max-height: 82dvh; overflow-y: auto; padding: 18px;
        }
        .shop-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .shop-card-header .shop-modal-title { font-size: 16px; font-weight: 900; color: #a4e968; }
        .shop-close-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        .shop-item {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px; margin-bottom: 8px;
        }
        .shop-item-emoji { font-size: 28px; width: 40px; text-align: center; flex-shrink: 0; }
        .shop-item-img { width: 40px; height: 40px; object-fit: contain; }
        .shop-item-info { flex: 1; min-width: 0; }
        .shop-item-name { font-size: 13px; font-weight: 800; color: #fff; }
        .shop-item-sub { font-size: 10.5px; color: #9fd88a; margin-top: 2px; }
        .shop-buy-btn {
            font-family: inherit; font-weight: 900; font-size: 12px; cursor: pointer;
            border: none; border-radius: 12px; padding: 8px 12px;
            background: linear-gradient(135deg, #ffcb05, #ff9500); color: #1c1200; flex-shrink: 0;
        }
        .qty-buy { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .qty-btn {
            width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
            background: rgba(255,255,255,0.15); color: #fff; font-weight: 900; font-size: 14px; line-height: 1;
        }
        .qty-val { font-weight: 800; font-size: 13px; min-width: 14px; text-align: center; color: #fff; }

        /* ============ TOAST ============ */
        #gardenToast {
            position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
            background: rgba(20,24,18,0.95); border: 2px solid #6fcf3f; color: #fff;
            font-weight: 800; font-size: 12.5px; padding: 10px 16px; border-radius: 18px;
            z-index: 7000; text-align: center; max-width: 88vw;
            opacity: 0; pointer-events: none; transition: opacity .25s ease;
        }
        #gardenToast.show { opacity: 1; }

        /* ============ HIỆU ỨNG CÔNG CỤ ============ */
        .fx-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; z-index: 50; }
        .fx-particle { position: absolute; top: -6px; font-size: 15px; opacity: 0; }

        .fx-water .fx-particle { animation: fxFall 0.85s ease-in forwards; }
        @keyframes fxFall {
            0%   { transform: translateY(-8px); opacity: 0; }
            15%  { opacity: 1; }
            100% { transform: translateY(52px); opacity: 0; }
        }

        .fx-sparkle .fx-particle { top: 40%; animation: fxSparkle 0.9s ease-out forwards; }
        @keyframes fxSparkle {
            0%   { transform: translate(0,0) scale(0.4) rotate(0deg); opacity: 0; }
            25%  { opacity: 1; }
            100% { transform: translate(var(--dx, 12px), -38px) scale(1.1) rotate(120deg); opacity: 0; }
        }

        .fx-bubble .fx-particle { top: 60%; animation: fxBubble 1s ease-in-out forwards; }
        @keyframes fxBubble {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            20%  { opacity: 1; }
            100% { transform: translateY(-46px) translateX(6px); opacity: 0; }
        }

        .fx-sickle .fx-particle {
            top: 50%; left: 50% !important; font-size: 30px;
            transform: translate(-50%,-50%) scale(0.3); animation: fxFlash 0.5s ease-out forwards;
        }
        @keyframes fxFlash {
            0%   { transform: translate(-50%,-50%) scale(0.2) rotate(-20deg); opacity: 0; }
            40%  { transform: translate(-50%,-50%) scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 0; }
        }

        /* ============ QUIZ MODAL (pkm_quiz.js tự bật/tắt) ============ */
        #quiz-overlay {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(5, 6, 14, 0.88); backdrop-filter: blur(3px); z-index: 8000; padding: 16px;
        }
        .quiz-card {
            background: #12162a; border: 3px solid #ffcb05; border-radius: 20px;
            padding: 22px 18px; width: 100%; max-width: 420px; max-height: 88dvh;
            overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.6); text-align: center;
        }
        .quiz-question { font-size: 16px; font-weight: bold; margin-bottom: 14px; color: #fff; line-height: 1.4; }
        .options-grid { display: grid; gap: 8px; width: 100%; }
        .option-btn {
            background: #1e1e35; border: 2px solid #3a3a5c; color: #fff; padding: 12px;
            border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: left;
        }
        .option-btn:active { background: #2a2a50; }
    </style>
</head>
<body>
    <div id="top-bar">
        <div style="display:flex; align-items:center; gap:8px; min-width:0;">
            <a class="back-link" href="pkm.html" title="Về bản đồ">←</a>
            <div class="title">🌾 PKM GARDEN</div>
        </div>
        <div id="lessonsLearnedTag">📘 Đã học 0 bài</div>
        <div class="currencies">
            <span class="dv">💠 <span id="gardenDV">0</span></span>
            <span class="exp">⭐ <span id="gardenEXP">0</span></span>
        </div>
        <button id="toolShopOpenBtn" onclick="openToolShop()" title="Cửa hàng công cụ">🧰</button>
    </div>

    <div id="toolBanner"></div>

    <div class="garden-section">
        <h2>🌱 Vườn Cây</h2>
        <div id="landField"></div>
    </div>

    <div class="garden-section">
        <h2>🐣 Chuồng Trại</h2>
        <div id="barnPen">
            <button id="addAnimalBtn" title="Nuôi thêm Pokémon">＋</button>
        </div>
    </div>

    <!-- THANH KHO ĐỒ -->
    <div id="toolbar">
        <button class="tool-btn" data-tool="water">
            <div class="tool-emoji">💧</div>
            <div class="tool-count">0</div>
        </button>
        <button class="tool-btn" data-tool="fertilizer">
            <div class="tool-emoji">🌿</div>
            <div class="tool-count">0</div>
        </button>
        <button class="tool-btn" data-tool="sickle">
            <div class="tool-emoji">🔪</div>
            <div class="tool-count">0</div>
        </button>
        <button class="tool-btn" data-tool="brush">
            <div class="tool-emoji">🧽</div>
            <div class="tool-count">0</div>
        </button>
    </div>

    <!-- SHOP HẠT GIỐNG / CON GIỐNG (DV) -->
    <div id="shopSeedsModal" class="shop-overlay">
        <div class="shop-card">
            <div class="shop-card-header">
                <div class="shop-modal-title" id="shopSeedsTitle">🌱 Chọn hạt giống</div>
                <button class="shop-close-btn" onclick="closeSeedShop()">✕</button>
            </div>
            <div id="shopSeedsList"></div>
        </div>
    </div>

    <!-- SHOP CÔNG CỤ (EXP) -->
    <div id="shopToolsModal" class="shop-overlay">
        <div class="shop-card">
            <div class="shop-card-header">
                <div class="shop-modal-title">🧰 Cửa hàng công cụ</div>
                <button class="shop-close-btn" onclick="closeToolShop()">✕</button>
            </div>
            <div id="shopToolsList"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="gardenToast"></div>

    <!-- QUIZ MODAL -->
    <div id="quiz-overlay">
        <div class="quiz-card">
            <div class="quiz-question" id="quiz-word">
                <div style="color:#888; font-size:13px;">⏳ Đang chuẩn bị câu hỏi...</div>
            </div>
            <div class="options-grid" id="quiz-options"></div>
        </div>
    </div>

    <script src="global-config.js"></script>
    <script src="tacham.js"></script>
    <script type="module" src="pkm_quiz.js"></script>
    <script src="pkm_garden_tree.js"></script>
    <script src="pkm_garden.js"></script>
</body>
</html>
