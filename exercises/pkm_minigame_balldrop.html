                      <!DOCTYPE html>
                      <html lang="vi">
                      <head>
                      <meta charset="UTF-8" />
                      <title>🍬 Thả Kẹo Vào Lọ</title>
                      <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
                      <style>
                        :root {
                          --poke-yellow: #FFCB05;
                          --poke-red:    #e53935;
                          --poke-blue:   #3b6fe0;
                          --poke-green:  #43a047;
                        }
                        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
                        html, body {
                          margin: 0; padding: 0; height: 100%; overflow: hidden;
                          font-family: 'Segoe UI', sans-serif; color: #fff; user-select: none;
                          background: linear-gradient(180deg, #4a1a5c 0%, #7b2d8e 55%, #b24fae 100%);
                        }

                        #pkdRoot { position: fixed; inset: 0; display: flex; flex-direction: column; }

                        #pkdHeader {
                          flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
                          padding: 10px 16px; background: rgba(0,0,0,.25);
                        }
                        #pkdProgress { font-size: 13px; font-weight: 800; color: var(--poke-yellow); }
                        #pkdTimerBarWrap { flex: 1 1 auto; margin: 0 14px; height: 8px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; }
                        #pkdTimerBar { height: 100%; background: linear-gradient(90deg, var(--poke-green), var(--poke-yellow)); width: 100%; transform-origin: left; }

                        #pkdScene { position: relative; flex: 1 1 auto; overflow: hidden; min-height: 0; display: flex; flex-direction: column; align-items: center; padding: 14px; }

                        #pkdPromptCard {
                          background: rgba(0,0,0,.32); border: 3px solid var(--poke-yellow); border-radius: 20px;
                          padding: 16px 20px; max-width: 480px; width: 100%; text-align: center;
                          box-shadow: 0 8px 24px rgba(0,0,0,.4); margin-bottom: 8px;
                        }
                        #pkdPromptCard img { max-height: 90px; border-radius: 10px; margin-bottom: 8px; }

                        #pkdDispenser {
                          font-size: 40px; width: 68px; height: 68px; border-radius: 50%;
                          background: rgba(255,255,255,.1); border: 3px dashed rgba(255,203,5,.6);
                          display: flex; align-items: center; justify-content: center; margin: 10px 0;
                          flex: 0 0 auto;
                        }

                        #pkdJarsWrap {
                          display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
                          flex: 1 1 auto; align-content: center;
                        }
                        .pkd-jar { cursor: pointer; text-align: center; transition: transform .15s; touch-action: manipulation; }
                        .pkd-jar:active { transform: scale(.95); }
                        .pkd-jar.pkd-locked { pointer-events: none; }
                        .pkd-jar-candy-pile { width: 84px; height: 18px; border-radius: 10px 10px 0 0; margin: 0 auto -5px; opacity: .92; }
                        .pkd-jar-body {
                          width: 96px; height: 96px; border-radius: 0 0 20px 20px; border: 4px solid;
                          background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center;
                          overflow: hidden; padding: 6px;
                        }
                        .pkd-jar-body img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
                        .pkd-jar-label { font-size: 14px; font-weight: 700; color: #fff; text-align: center; }
                        .pkd-jar.pkd-jar-correct .pkd-jar-body { box-shadow: 0 0 0 4px #4caf50 inset; background: rgba(76,175,80,.3); }
                        .pkd-jar.pkd-jar-wrong .pkd-jar-body { box-shadow: 0 0 0 4px #e74c3c inset; background: rgba(231,76,60,.25); }

                        .pkd-candy-flying {
                          position: absolute; width: 22px; height: 22px; border-radius: 50%; z-index: 10;
                          transition: left .42s cubic-bezier(.3,.7,.3,1), top .42s cubic-bezier(.3,.7,.3,1), transform .42s ease;
                          box-shadow: 0 3px 6px rgba(0,0,0,.4);
                        }

                        #pkdFeedback { text-align: center; margin-top: 10px; font-size: 16px; font-weight: 700; min-height: 22px; flex: 0 0 auto; }

                        #pkdStartOverlay {
                          position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
                          align-items: center; justify-content: center; gap: 16px;
                          background: linear-gradient(180deg, #4a1a5c, #b24fae);
                          text-align: center; padding: 24px;
                        }
                        #pkdStartOverlay h2 { color: var(--poke-yellow); font-size: 24px; margin: 0; }
                        #pkdStartOverlay p { color: #eee; font-size: 15px; margin: 0; max-width: 320px; }
                        #pkdStartBtn {
                          padding: 16px 36px; font-size: 18px; font-weight: bold;
                          background: var(--poke-yellow); color: #333; border: none; border-radius: 14px;
                          cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.4);
                        }
                      </style>
                      </head>
                      <body>

                      <div id="pkdRoot">
                        <div id="pkdHeader">
                          <span id="pkdProgress">0/0</span>
                          <div id="pkdTimerBarWrap"><div id="pkdTimerBar"></div></div>
                        </div>
                        <div id="pkdScene">
                          <div id="pkdPromptCard"></div>
                          <div id="pkdDispenser">🍬</div>
                          <div id="pkdJarsWrap"></div>
                          <div id="pkdFeedback"></div>
                        </div>
                      </div>

                      <div id="pkdStartOverlay">
                        <div style="font-size:56px;">🍬</div>
                        <h2>Thả Kẹo Vào Lọ</h2>
                        <p>Chạm vào lọ chứa đáp án đúng để thả kẹo vào — thả sai lọ thì tính sai, thả trượt ra ngoài thì được thả lại!</p>
                        <button id="pkdStartBtn">▶ Bắt đầu</button>
                      </div>

                      <script type="module" src="pkm_minigame_balldrop.js"></script>
                      </body>
                      </html>
