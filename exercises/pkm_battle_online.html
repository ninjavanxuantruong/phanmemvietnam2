<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pokémon Battle Online</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pkm_3d.css">
<link rel="stylesheet" href="pkm_arena3d.css">
<style>
    html, body { height:100%; overflow:hidden; margin:0; font-family:'Be Vietnam Pro',sans-serif; background:#0a0c16; }

    /* Trang này đang đấu -> ẩn nút nổi của pkm_presence.js cho đỡ vướng */
    #pkmp-btn, #pkmp-panel { display:none !important; }

    /* ============== MÀN CHỜ TRẬN / KHÔNG CÓ TRẬN ============== */
    #wait-overlay {
        position:fixed; inset:0; z-index:100000;
        background:radial-gradient(circle, #1a2440 0%, #0a0c16 100%);
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        color:#fff; text-align:center; padding:20px; box-sizing:border-box;
    }
    #wait-overlay .spinner {
        width:56px; height:56px; border-radius:50%; border:5px solid rgba(255,203,5,.2);
        border-top-color:#ffcb05; animation:spin 1s linear infinite; margin-bottom:18px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #wait-overlay h2 { color:#ffcb05; font-size:18px; margin:0 0 6px; }
    #wait-overlay p { color:#aaa; font-size:13px; margin:0 0 18px; }
    #wait-overlay a.back {
        background:#333; color:#fff; border:1px solid #555; border-radius:20px;
        padding:9px 22px; font-size:13px; text-decoration:none;
    }

    /* ============== MÀN CHỌN ĐỘI HÌNH ============== */
    #teamselect-overlay {
        position:fixed; inset:0; z-index:99998; display:none;
        background:radial-gradient(circle, #1a2440 0%, #0a0c16 100%);
        flex-direction:column; align-items:center; padding:20px; box-sizing:border-box;
        color:#fff; overflow-y:auto;
    }
    #teamselect-overlay h2 { color:#ffcb05; font-size:20px; margin:10px 0 4px; }
    #teamselect-overlay .sub { color:#aaa; font-size:13px; margin-bottom:18px; text-align:center; }
    #ts-grid {
        display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
        gap:10px; width:100%; max-width:520px; margin-bottom:20px;
    }
    .ts-card {
        background:rgba(255,255,255,.06); border:2px solid #3a3a5c; border-radius:12px;
        padding:8px 4px; text-align:center; cursor:pointer; transition:.15s;
    }
    .ts-card img { width:56px; height:56px; object-fit:contain; }
    .ts-card .n { font-size:11px; font-weight:700; margin-top:2px; }
    .ts-card .badge {
        display:inline-block; background:#ffcb05; color:#000; font-size:10px; font-weight:900;
        border-radius:10px; padding:1px 7px; margin-top:3px;
    }
    .ts-card.selected { border-color:#ffcb05; background:rgba(255,203,5,.15); }
    #ts-confirm {
        background:linear-gradient(135deg,#2ecc71,#1a9c53); color:#fff; border:none;
        padding:14px 40px; border-radius:30px; font-weight:900; font-size:15px; cursor:pointer;
    }
    #ts-confirm:disabled { background:#444; color:#888; cursor:not-allowed; }
    #ts-waiting { color:#ffcb05; font-size:14px; margin-top:16px; display:none; }
    #ts-oppname { color:#ffcb05; font-weight:800; }

    /* ============== MÀN ĐẤU (giữ layout gốc từ pkm_battle.html) ============== */
    .game-viewport { display:flex; flex-direction:column; height:100dvh; width:100vw; overflow:hidden; }
    #battle-arena { flex:0 0 67dvh; overflow:hidden; position:relative; }
    #quiz-overlay {
        flex:1; min-height:0; position:relative !important; top:auto !important; left:auto !important;
        width:100% !important; height:auto !important; background:#0d0d1a; border-top:3px solid #ffcb05;
        display:flex !important; flex-direction:column; align-items:center; justify-content:flex-start;
        overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; z-index:10 !important;
        padding:8px 6px 40px; box-sizing:border-box;
    }
    @media (min-width:768px) {
        .game-viewport { flex-direction:row; }
        #battle-arena { flex:0 0 62vw; height:100vh; }
        #quiz-overlay { flex:1; height:100vh !important; border-top:none; border-left:3px solid #ffcb05; padding:20px 12px; align-items:center; justify-content:flex-start; }
    }
    .quiz-card { background:transparent; color:#fff; width:100%; max-width:100%; padding:6px 8px; text-align:center; border:none; }
    #quiz-role-label { font-size:13px; font-weight:800; margin-bottom:6px; padding:4px 10px; border-radius:8px; display:inline-block; }
    #quiz-role-label.quiz-role-primary { color:#000; background:#ffcb05; }
    #quiz-role-label.quiz-role-secondary { color:#ccc; background:rgba(255,255,255,.08); }
    .quiz-question { font-size:17px; font-weight:bold; margin-bottom:12px; color:#fff; line-height:1.4; }
    .options-grid { display:grid; gap:8px; width:100%; }
    .option-btn { background:#1e1e35; border:2px solid #3a3a5c; color:#fff; padding:10px 12px; border-radius:8px; font-size:14px; font-weight:bold; cursor:pointer; text-align:left; }
    .option-btn:active { background:#2a2a50; }

    #victory-overlay {
        position:fixed; inset:0; background:linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(20,20,60,0.95) 100%);
        display:none; flex-direction:column; justify-content:center; align-items:center; z-index:99999 !important;
        backdrop-filter:blur(5px);
    }
    .victory-img { width:180px; height:180px; object-fit:contain; filter:drop-shadow(0 0 30px #ffcb05); margin-bottom:20px; }
    #victory-exp-text { text-align:center; }

    #opp-status-banner {
        position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:99997;
        background:rgba(231,76,60,.92); color:#fff; font-weight:700; font-size:13px;
        padding:8px 18px; border-radius:20px; display:none;
    }
</style>
</head>
<body>

<!-- ============== CHỜ TRẬN / KHÔNG CÓ TRẬN NÀO ============== -->
<div id="wait-overlay">
    <div class="spinner"></div>
    <h2>Đang vào trận...</h2>
    <p id="wait-text">Đang kết nối tới trận đấu của bạn.</p>
    <a class="back" id="wait-back" href="pkm.html" style="display:none;">◀ Quay lại</a>
</div>

<!-- ============== MÀN CHỌN ĐỘI HÌNH ============== -->
<div id="teamselect-overlay">
    <h2>🎯 Chọn đội hình ra trận</h2>
    <div class="sub">Đấu với <span id="ts-oppname">...</span> — <span id="ts-sub-count"></span></div>
    <div id="ts-grid"></div>
    <button id="ts-confirm" disabled>XÁC NHẬN</button>
    <div id="ts-waiting">⏳ Đã gửi — đang chờ đối thủ chọn xong...</div>
</div>

<!-- ============== MÀN ĐẤU ============== -->
<div id="opp-status-banner"></div>
<div class="game-viewport">
    <main id="battle-arena" class="battle-arena">
        <div id="player-team-container"></div>
        <div id="enemy-team-container"></div>
        <div id="battle-log"></div>
        <div id="turn-display"></div>
    </main>
    <div id="quiz-overlay" style="display:none;">
        <div class="quiz-card">
            <div id="quiz-role-label"></div>
            <div class="quiz-question" id="quiz-word">
                <div style="color:#555; font-size:13px; margin-top:20px;">⏳ Đang chuẩn bị trận đấu...</div>
            </div>
            <div class="options-grid" id="quiz-options"></div>
        </div>
    </div>
</div>

<div id="skill-scene-overlay"></div>
<div id="quiz-stats" style="position:fixed !important; top:15px !important; right:15px !important; bottom:auto !important; left:auto !important; z-index:9999 !important;">
    ✅ 0 &nbsp; ❌ 0 &nbsp; 📊 0 câu
</div>

<div id="victory-overlay">
    <div class="victory-title" style="font-size:40px;font-weight:900;color:#ffcb05;">🏆</div>
    <img class="victory-img" id="victory-pkm-img"
         src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
         alt="Result">
    <div class="victory-exp" id="victory-exp-text" style="background:rgba(255,203,5,.15); border:2px solid #ffcb05; border-radius:15px; padding:12px 30px;"></div>
</div>

<!-- ================== SCRIPTS ================== -->
<script src="global-config.js"></script>
<script src="pkm_battle_random.js"></script>
<script src="tacham.js"></script>
<script src="pkm_skill_back.js"></script>
<script src="pkm_skill.js"></script>
<script src="pkm_styles.js"></script>

<script>
    // Override quiz-overlay display=none (giống bản offline) để vùng quiz luôn hiển thị
    document.addEventListener('DOMContentLoaded', () => {
        const overlay = document.getElementById('quiz-overlay');
        if (!overlay) return;
        let _display = 'none'; // bắt đầu ẩn, BattleOnlineGame.init() sẽ mở khi vào trận
        Object.defineProperty(overlay.style, 'display', {
            get() { return _display; },
            set(val) { _display = (val === 'none') ? _display : val; },
            configurable: true
        });
    });
</script>

<script type="module" src="pkm_quiz.js"></script>
<script src="pkm_arena3d.js"></script>
<script src="pkm_skill_effect.js"></script>
<script src="pkm_skill_aoe.js"></script>
<script src="pkm_skill_normal.js"></script>
<script src="pkm_score.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="pkm_presence.js"></script>
<script src="pkm_battle_net.js"></script>
<script src="pkm_battle_online.js"></script>

<!-- ================== CHỌN ĐỘI HÌNH (ghép trận đã xong từ trang trước) ================== -->
<script>
(() => {
    const inventory = JSON.parse(localStorage.getItem('pkm_inventory')) || [];
    let unitsAllowed = 3;

    if (!sessionStorage.getItem('pkm_net_room_id')) {
        document.getElementById('wait-text').textContent =
            'Bạn chưa có trận nào đang chờ — hãy thách đấu hoặc ghép ngẫu nhiên từ trang chính.';
        document.querySelector('#wait-overlay .spinner').style.display = 'none';
        document.getElementById('wait-back').style.display = 'inline-block';
        return; // không kết nối gì thêm — tránh gây rối nếu vào nhầm trang
    }

    window.PkmBattleNet.connect();

    // Đợi quá lâu mà không có phản hồi gì (server có thể đã dọn phòng do hết hạn)
    const giveUpTimer = setTimeout(() => {
        document.getElementById('wait-text').textContent =
            'Không tìm thấy trận đấu (có thể đã hết hạn) — quay lại trang chính để thử lại nhé.';
        document.querySelector('#wait-overlay .spinner').style.display = 'none';
        document.getElementById('wait-back').style.display = 'inline-block';
    }, 8000);

    window.PkmBattleNet.on('needTeamSelect', (data) => {
        clearTimeout(giveUpTimer);
        unitsAllowed = data.unitsAllowed;
        document.getElementById('wait-overlay').style.display = 'none';
        document.getElementById('teamselect-overlay').style.display = 'flex';
        document.getElementById('ts-oppname').textContent = data.opponentName || 'đối thủ';
        document.getElementById('ts-sub-count').textContent = `chọn đúng ${unitsAllowed} Pokémon của bạn`;

        if (data.alreadySubmitted) {
            document.getElementById('ts-confirm').style.display = 'none';
            document.getElementById('ts-waiting').style.display = 'block';
            return;
        }
        renderTeamGrid();
    });

    // Có trận thật (battle:start / state:update) -> khỏi cần chờ gì nữa
    window.PkmBattleNet.on('battleStart', () => {
        clearTimeout(giveUpTimer);
        document.getElementById('wait-overlay').style.display = 'none';
        document.getElementById('teamselect-overlay').style.display = 'none';
    });
    window.PkmBattleNet.on('stateUpdate', () => {
        clearTimeout(giveUpTimer);
        document.getElementById('wait-overlay').style.display = 'none';
        document.getElementById('teamselect-overlay').style.display = 'none';
    });

    let selected = [];
    function renderTeamGrid() {
        selected = [];
        const grid = document.getElementById('ts-grid');
        grid.innerHTML = '';
        inventory.forEach((pkm, i) => {
            const card = document.createElement('div');
            card.className = 'ts-card';
            card.innerHTML = `
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pkm.id}.png">
                <div class="n">${pkm.name || 'Pokémon'}</div>
                <span class="badge" style="display:none;">✓</span>`;
            card.onclick = () => toggleSelect(i, card);
            grid.appendChild(card);
        });
        updateConfirmBtn();
    }
    function toggleSelect(idx, card) {
        const pos = selected.indexOf(idx);
        if (pos !== -1) {
            selected.splice(pos, 1);
            card.classList.remove('selected');
            card.querySelector('.badge').style.display = 'none';
        } else {
            if (selected.length >= unitsAllowed) return;
            selected.push(idx);
            card.classList.add('selected');
            card.querySelector('.badge').style.display = 'inline-block';
        }
        updateConfirmBtn();
    }
    function updateConfirmBtn() {
        document.getElementById('ts-confirm').disabled = selected.length !== unitsAllowed;
    }
    document.getElementById('ts-confirm').onclick = () => {
        const teamData = selected.map(i => {
            const p = inventory[i];
            return {
                id: p.id, name: p.name, type: p.type || 'normal',
                hp: p.baseStats?.hp || 20, atk: p.baseStats?.atk || 20,
                def: p.baseStats?.def || 15, sAtk: p.baseStats?.sAtk || 20,
            };
        });
        window.PkmBattleNet.submitTeam(teamData);
        document.getElementById('ts-confirm').style.display = 'none';
        document.getElementById('ts-waiting').style.display = 'block';
    };

    window.PkmBattleNet.on('opponentDisconnected', () => {
        const b = document.getElementById('opp-status-banner');
        b.textContent = "⚠️ Đối thủ mất kết nối — đang chờ tối đa 60 giây...";
        b.style.display = 'block';
    });
    window.PkmBattleNet.on('opponentReconnected', () => {
        document.getElementById('opp-status-banner').style.display = 'none';
    });
    window.PkmBattleNet.on('battleEnd', () => {
        document.getElementById('opp-status-banner').style.display = 'none';
    });
})();
</script>

</body>
</html>
